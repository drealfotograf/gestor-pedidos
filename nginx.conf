server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # El HTML y el código propio se revalidan siempre: así una actualización se ve al recargar.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }

  # Las bibliotecas de terceros no cambian.
  location /vendor/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
